# One-shot Cosmos-Predict2.5 inference run.
#
# Prereqs (see deploy/README.md):
#   - image built on the node as  localhost/cosmos-predict2.5:local
#   - secret 'hf-token' created:   kubectl create secret generic hf-token --from-literal=HF_TOKEN=hf_xxx
#   - PVC 'cosmos-data' applied:   kubectl apply -f deploy/k8s/10-pvc.yaml
#
# Run:
#   kubectl apply -f deploy/k8s/20-job.yaml
#   kubectl logs -f job/cosmos-infer
#
# Re-run after changing something:
#   kubectl delete job cosmos-infer ; kubectl apply -f deploy/k8s/20-job.yaml
#
# Only runs 19:00-03:00 Chile time: run_infer.sh refuses to start outside that
# window and stops the run at 03:00. For the automatic nightly run see 30-cronjob.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos-infer
spec:
  backoffLimit: 0
  # Backstop only - run_infer.sh stops at 03:00 itself. 9 h, not 8, because the
  # night Chile's clocks go back, 19:00 -> 03:00 lasts 9 real hours.
  activeDeadlineSeconds: 32400
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: cosmos-infer
    spec:
      restartPolicy: Never
      containers:
        - name: cosmos
          image: localhost/cosmos-predict2.5:local
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          # 'args' (not 'command') keeps the image entrypoint, which runs `uv sync`.
          args: ["bash", "deploy/run_infer.sh"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /data/hf
            - name: OUTPUT_DIR
              value: /data/outputs
            - name: INPUT
              value: assets/base/shovel_example.json
            - name: MODEL
              value: 2B/post-trained
            # Must match the nvidia.com/gpu limit below. The node time-slices its
            # 2 x L40S into 8 shared "GPUs", so asking for 2 may land on the SAME card.
            # Only raise both to 2 if gpu-check shows two different GPU UUIDs.
            - name: NUM_GPUS
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              cpu: "16"
              memory: 64Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cosmos-data
        - name: dshm
          emptyDir:
            medium: Memory
            # torchrun workers share tensors through /dev/shm; counts against node RAM (128 GB).
            sizeLimit: 32Gi
