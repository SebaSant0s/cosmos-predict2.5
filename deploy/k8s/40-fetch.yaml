# Tiny pod (no GPU) that mounts the data volume so you can copy results out.
# `kubectl cp` needs a RUNNING container, and finished inference pods aren't, so:
#   kubectl apply -f deploy/k8s/40-fetch.yaml
#   kubectl wait --for=condition=Ready pod/cosmos-fetch
#   kubectl cp cosmos-fetch:/data/outputs ./outputs
#   kubectl delete -f deploy/k8s/40-fetch.yaml
# Sleeps for 1 h max, then exits on its own.
apiVersion: v1
kind: Pod
metadata:
  name: cosmos-fetch
spec:
  restartPolicy: Never
  containers:
    - name: fetch
      image: docker.io/library/busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cosmos-data
